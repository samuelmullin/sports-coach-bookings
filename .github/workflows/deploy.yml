name: Deploy

# Gated on CI: both jobs are triggered by the *completion* of the "CI" workflow
# and only run when that run succeeded.
#   * staging    - CI green on `main`
#   * production - CI green on a `v*` tag (gated by the protected environment)
#
# Images are built here and pushed to GHCR; Fly then deploys the exact image
# (no rebuild on the platform) so staging and prod run identical bits.
#
# Manual fallback: workflow_dispatch with `environment` + `ref`.
#
# Required repository secrets:
#   FLY_API_TOKEN_STAGING  - Fly token for the staging app
#   FLY_API_TOKEN          - Fly token for the production app
# GHCR auth uses the workflow GITHUB_TOKEN.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [staging, production]
        default: staging
      ref:
        description: "Git ref (branch or tag) to deploy"
        type: string
        required: false

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || inputs.environment || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  REF: ${{ github.event.workflow_run.head_branch || inputs.ref || github.ref_name }}

jobs:
  staging:
    name: Deploy staging
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    environment: staging

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && env.SHA || env.REF }}

      - name: Compute image name
        id: vars
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:staging-${{ env.SHA }}
            ${{ steps.vars.outputs.image }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly (staging)
        run: |
          flyctl deploy \
            --config fly.staging.toml \
            --image "${{ steps.vars.outputs.image }}:staging-${{ env.SHA }}" \
            --wait-timeout 10m
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_STAGING }}

  production:
    name: Deploy production
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        startsWith(github.event.workflow_run.head_branch, 'v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && env.SHA || env.REF }}

      - name: Compute image name
        id: vars
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ env.REF }}
            ${{ steps.vars.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly (production)
        run: |
          flyctl deploy \
            --config fly.toml \
            --image "${{ steps.vars.outputs.image }}:${{ env.REF }}" \
            --wait-timeout 10m
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
