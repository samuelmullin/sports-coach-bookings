# nginx config for the optional standalone frontend image.
#
# - Root serves the portal SPA.
# - /admin/ serves the admin SPA (built with Vite base=/admin/).
# - Both use history fallback so client-side routes deep-link correctly.
# - /health is a static 200 for platform probes.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
