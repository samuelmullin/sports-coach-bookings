# Local development parity stack.
#
# Fragments:
#   * postgres  - Postgres 16 with the non-superuser scb_app role pre-created
#   * rustfs    - S3-compatible object storage for exercising the S3 backends
#
# Recommended local flow (just the infrastructure; run the app with `mix`):
#
#     docker compose up -d postgres rustfs rustfs-init
#     cd backend && mix setup && mix phx.server
#
# To run the built release image as well (slower; builds the full image):
#
#     docker compose --profile app up --build
#
# All credentials below are DEV-ONLY and intentionally not secret.

services:
  postgres:
    image: postgres:16
    container_name: scb-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-app-role.sql:/docker-entrypoint-initdb.d/10-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:latest
    container_name: scb-rustfs
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfsdata:/data

  rustfs-init:
    image: amazon/aws-cli:latest
    depends_on:
      - rustfs
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: scb-uploads
      S3_PRIVATE_BUCKET: scb-private
    volumes:
      - ./infra/rustfs/create-buckets.sh:/create-buckets.sh:ro
    entrypoint: ["/bin/sh", "/create-buckets.sh"]

  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: scb-app
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
    environment:
      DATABASE_URL: ecto://scb_app:scb_app@postgres:5432/sports_coach_bookings_dev
      SECRET_KEY_BASE: dev-only-secret-key-base-not-for-production-0000000000000000
      PLAYER_MEDICAL_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      PHX_HOST: localhost
      PORT: "4000"
      BASE_DOMAIN: localhost
      PLATFORM_HOST: localhost
      REPO_ROOT: /app
      S3_BUCKET: scb-uploads
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: rustfsadmin
      S3_SECRET_ACCESS_KEY: rustfsadmin
      S3_ENDPOINT: http://rustfs:9000
      S3_PRIVATE_BUCKET: scb-private
      S3_FORCE_PATH_STYLE: "true"
    ports:
      - "4000:4000"

volumes:
  pgdata:
  rustfsdata:
